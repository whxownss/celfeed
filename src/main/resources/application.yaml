spring:
  datasource:
    url: jdbc:mysql://localhost:3306/celfeed?rewriteBatchedStatements=true #&profileSQL=true&logger=Slf4JLogger&maxQuerySizeToLog=999999
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    error:
      whitelabel:
        enabled: false
      include-exception: false
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  jpa:
    open-in-view: false
#    hibernate:
#      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

logging.level:
  xowns.celfeed: info
  org.hibernate.SQL: debug

management:
  info:
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

server:
  tomcat:
    mbeanregistry:
      enabled: true