spring:
  datasource:
    url: jdbc:mysql://localhost:3306/celfeed?rewriteBatchedStatements=true #&profileSQL=true&logger=Slf4JLogger&maxQuerySizeToLog=999999
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    error:
      whitelabel:
        enabled: false
      include-exception: false
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      repositories: # Redis repository 쓸거면 없애면 됨 (로그때문에 해둠)
        enabled: false
  session:
    redis:
#    store-type: redis 없어도 되네?
      namespace: celfeed:session # @EnableRedisHttpSession에서 redisNamespace지정해줘야 적용됨
  kafka:
    bootstrap-servers: localhost:29092

logging.level:
  com.xowns.celfeed: info
  org.hibernate.SQL: debug
  org.springframework.transaction.interceptor: TRACE
  org.springframework.data.redis: DEBUG
  org.apache.kafka: INFO
  org.springframework.kafka: INFO

management:
  info:
    java:
      enabled: true
    os:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

server:
  tomcat:
    mbeanregistry:
      enabled: true