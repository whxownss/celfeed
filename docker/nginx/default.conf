upstream server-social {
    server server-social:8080;
}

upstream server-notification {
    server server-notification:8081;
}

server {
    listen 80;

    location / {
        proxy_pass http://server-social;
        proxy_set_header Host $host;
    }

    location ^~ /api/notifications {
        proxy_pass http://server-notification;
        proxy_set_header Host $host;
    }
}