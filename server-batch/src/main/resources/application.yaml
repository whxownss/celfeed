app:
  datasource:
    notification:
      shards:
        - shard-no: 0
          name: notification-shard-0
          url: jdbc:mysql://localhost:3306/celfeed_notification1?rewriteBatchedStatements=true
          username: ssafy
          password: ssafy
          driver-name: com.mysql.cj.jdbc.Driver
          max-pool: 10
          min-idle: 10
          timeout: 30000
        - shard-no: 1
          name: notification-shard-1
          url: jdbc:mysql://localhost:3306/celfeed_notification2?rewriteBatchedStatements=true
          username: ssafy
          password: ssafy
          driver-name: com.mysql.cj.jdbc.Driver
          max-pool: 10
          min-idle: 10
          timeout: 30000
  sharding:
    notification:
      strategy: MODULAR
      mod: 2
  #      sharding_key: receiver_id

spring:
  application:
    name: server-batch
  datasource:
    batch-data:
      jdbc-url: jdbc:mysql://localhost:3306/celfeed_batch_data
      username: ssafy
      password: ssafy
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
    batch-meta:
      jdbc-url: jdbc:mysql://localhost:3306/celfeed_batch_meta
      username: ssafy
      password: ssafy
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 2
      minimum-idle: 2
      connection-timeout: 30000
