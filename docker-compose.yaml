# Docker 엔진이 컨테이너 내부에서 상태 체크
# 상태 조건에 따라 의존하는 컨테이너 실행
# - localhost
#   - 같은 컴퓨터라고 판단하여 네트워크 없이 소켓 파일로 바로 붙음
#   - 초기화용 임시 서버는 TCP는 잠그고 소켓만 열어둔 상태로 초기화(init.sql) 끝나기 전에도 healthy
# - 127.0.0.1
#   - IP 그대로 TCP 포트로 접속
#   - TCP가 열린 진짜 서버는 초기화가 다 끝나야 healthy
x-mysql-healthcheck: &mysql-healthcheck
  test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD" ]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 30s

services:
  #########################################################################
  # MySQL
  #########################################################################
  # Social DB
  mysql-social:
    image: mysql:8.4
    container_name: mysql-social
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: celfeed_social
      TZ: Asia/Seoul
    volumes:
      - mysql-social-data:/var/lib/mysql
      - ./docker/mysql/social/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck: *mysql-healthcheck
  # Notification DB 1
  mysql-notification1:
    image: mysql:8.4
    container_name: mysql-notification1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: celfeed_notification1
      TZ: Asia/Seoul
    volumes:
      - mysql-notification1-data:/var/lib/mysql
      - ./docker/mysql/notification1/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck: *mysql-healthcheck
  # Notification DB 2
  mysql-notification2:
    image: mysql:8.4
    container_name: mysql-notification2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: celfeed_notification2
      TZ: Asia/Seoul
    volumes:
      - mysql-notification2-data:/var/lib/mysql
      - ./docker/mysql/notification2/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3308:3306"
    healthcheck: *mysql-healthcheck
  # Batch DB
  mysql-batch:
    image: mysql:8.4
    container_name: mysql-batch
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: celfeed_batch
      TZ: Asia/Seoul
    volumes:
      - mysql-batch-data:/var/lib/mysql
      - ./docker/mysql/batch/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3309:3306"
    healthcheck: *mysql-healthcheck
  #########################################################################
  # Spring Boot
  #########################################################################
  # Social API
  server-social:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: server-social
    image: server-social:21
    container_name: server-social
    ports:
      - "8080:8080"
    depends_on:
      mysql-social:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
  # Notification API
  server-notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: server-notification
    image: server-notification:21
    container_name: server-notification
    ports:
      - "8081:8081"
    depends_on:
      mysql-social:
        condition: service_healthy
      mysql-notification1:
        condition: service_healthy
      mysql-notification2:
        condition: service_healthy
      redis:
        condition: service_started
  # Consumer Server
  server-consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: server-consumer
    image: server-consumer:21
    container_name: server-consumer
    depends_on:
      mysql-social:
        condition: service_healthy
      mysql-notification1:
        condition: service_healthy
      mysql-notification2:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
  # Batch Server
  server-batch:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: server-batch
    image: server-batch:21
    container_name: server-batch
    depends_on:
      mysql-notification1:
        condition: service_healthy
      mysql-notification2:
        condition: service_healthy
      mysql-batch:
        condition: service_healthy
  #########################################################################
  # Kafka
  #########################################################################
  # Kafka Broker
  kafka:
    image: apache/kafka:4.4.0
    container_name: infra-kafka
    ports:
      - "9092:9092"
    environment:
      # KRAFT 설정
      KAFKA_NODE_ID: 1 #브로커 ID
      KAFKA_PROCESS_ROLES: broker,controller #브로커와 컨트롤러 역할 같이 수행
      CLUSTER_ID: 'ciWo7IWazngRchmPES6q5A==' #브로커가 속할 클러스터 ID
      # Listener 설정
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093 # Kafka가 수신할 주소와 포트 설정
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://kafka:9092 # 클라이언트에게 공개할 리스너 주소
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT # 리스너 보안 프로토콜
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # 컨트롤러 전용 리스너
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL # 브로커끼리 통신할 때 사용할 리스너
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093 # 쿼럼에 참여할 노드(컨트롤러) 목록 (노드ID@노드HOST:다른컨트롤러노드와통신할포트)
      # Kafka 기본 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Consumer 오프셋 정보 저장하는 토픽의 복제 개수
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # 트랜잭션 상태 저장하는 토픽의 복제 개수
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # 트랜잭션 상태 저장 시 필요한 최소 ISR 수
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # Consumer Group이 처음 구성될 때 최초 Rebalance를 시작하기 전 기다리는 시간
      KAFKA_LOG_DIRS: /var/lib/kafka/data # 로그(실제 데이터)를 저장할 위치
  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: infra-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # 연결할 브로커 주소
    depends_on:
      - kafka
  #########################################################################
  # Redis
  #########################################################################
  redis:
    image: redis:7.4-alpine
    container_name: infra-redis
    ports:
      - "6379:6379"
  #########################################################################
  # Nginx
  #########################################################################
  nginx:
    image: nginx:1.31-alpine
    container_name: infra-nginx
    ports:
      - "80:80"
    depends_on:
      - server-social
      - server-notification
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-social-data:
  mysql-notification1-data:
  mysql-notification2-data:
  mysql-batch-data: