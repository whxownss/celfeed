spring:
  application:
    name: server-social
  datasource:
    social:
      jdbc-url: jdbc:mysql://mysql-social:3306/celfeed_social #?rewriteBatchedStatements=true#&profileSQL=true&logger=Slf4JLogger&maxQuerySizeToLog=999999
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
#  redis:
#    sentinel:
#      master: mymaster
#      nodes: 127.0.0.1:26379,127.0.0.1:26479,127.0.0.1:26579
  data:
    redis:
#      sentinel:
#        master: mymaster
#        nodes: 127.0.0.1:26379,127.0.0.1:26479,127.0.0.1:26579
      host: redis
      port: 6379
#      password: root
      repositories: # Redis repository 쓸거면 없애면 됨 (로그때문에 해둠)
        enabled: false
  session:
    redis:
#    store-type: redis 없어도 되네?
      namespace: celfeed:session # @EnableRedisHttpSession에서 redisNamespace지정해줘야 적용됨
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all  # ISR에 포함된 복제본들의 확인까지 받아야 성공으로 판단
      retries: 3 # 메시지 전송 실패 시 재시도 횟수
      properties:
        enable.idempotence: true                 # 파티션별 배치마다 순번을 부여하여 +1 순번만 받아서 중복 방지 및 순서 보장
        max.in.flight.requests.per.connection: 5 # 응답 없이 보낼 수 있는 최대 요청 수 (브로커 캐시가 최근 5개 배치 정보 기억)
        max.block.ms: 3000                       # 메시지 전송 전에 메타데이터를 가져오거나 버퍼 공간 확보를 위해 기다리는 시간
        request.timeout.ms: 5000                 # 브로커에 요청을 보낸 후 응답을 기다리는 최대 시간 (이후 실패로 보고 재시도)
        delivery.timeout.ms: 10000               # 전송하기 시작한 시점부터 최종 성공/실패로 판단하기까지 보는 전체 시간
        linger.ms: 5                             # 메시지 Batch를 구성하기 위해 기다리는 최대 시간
        # delivery >= request + linger (max.block 시간은 delivery에 포함 되지 않음)

  web:
    error:
      whitelabel:
        enabled: false
      include-exception: false
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

app:
  outbox:
    relay:
      batch-size: 100
      fixed-delay: 3000
      max-retry: 5
      max-backoff-sec: 300
  kafka:
    producer:
      send-timeout: 12000 # delivery-timeout 보다 크게

logging.level:
#  com.xowns.celfeed: info
  org.hibernate.SQL: debug
  org.springframework.transaction.interceptor: TRACE
  org.springframework.data.redis: DEBUG
#  org.apache.kafka: INFO
#  org.springframework.kafka: INFO
#  org.springframework.kafka.transaction: DEBUG

management:
  endpoint:
    health:
      show-details: always
  # 엔드 포인트 노출
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true